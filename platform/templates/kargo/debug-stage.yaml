apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: debug-stage
  namespace: gitops-control
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: gitops-repo
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - uses: git-clone
        as: debug-step
        config:
          repoURL: https://github.com/ankur512512/gitops-infra-repo.git
          checkout:
          - branch: main
            path: out
      - uses: git-commit
        config:
          path: out
          message: {{ "${{ outputs[\"debug-step\"].commits[\"out\"] }}" }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: debug-clone-auto
  namespace: gitops-control
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: gitops-repo
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - uses: git-clone
        as: auto-clone
        config:
          repoURL: https://github.com/ankur512512/gitops-infra-repo.git
          checkout:
          - path: out
      - uses: git-commit
        config:
          path: out
          message: {{ "AutoCloneCommit: ${{ outputs[\"auto-clone\"].commits[\"out\"] }}" | quote }}
