apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: gitops-repo
  namespace: gitops-control
spec:
  project: gitops-control
  subscriptions:
  - git:
      repoURL: https://github.com/ankur512512/gitops-infra-repo.git
      branch: main
      directories:
      - apps/gitops-app/base
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: gitops-control
spec:
  project: gitops-control
  subscriptions:
    warehouse: gitops-repo
  # requestedFreight: [] # Try removing if it was causing issues, or adding.
                         # The error said "must be array", implying it saw null.
                         # In Go, nil slice serializes to null in JSON sometimes.
                         # Providing empty list might help.
  requestedFreight: []
  promotionMechanisms:
    gitRepoUpdates:
    - repoURL: https://github.com/ankur512512/gitops-infra-repo.git
      writeBranch: main
      kustomize:
        images:
        - image: nginx
          path: apps/gitops-app/overlays/dev
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stage
  namespace: gitops-control
spec:
  project: gitops-control
  subscriptions:
    upstreamStages:
    - name: dev
  requestedFreight: []
  promotionMechanisms:
    gitRepoUpdates:
    - repoURL: https://github.com/ankur512512/gitops-infra-repo.git
      writeBranch: main
      kustomize:
        images:
        - image: nginx
          path: apps/gitops-app/overlays/stage
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: gitops-control
spec:
  project: gitops-control
  subscriptions:
    upstreamStages:
    - name: stage
  requestedFreight: []
  promotionMechanisms:
    gitRepoUpdates:
    - repoURL: https://github.com/ankur512512/gitops-infra-repo.git
      writeBranch: main
      kustomize:
        images:
        - image: nginx
          path: apps/gitops-app/overlays/prod
