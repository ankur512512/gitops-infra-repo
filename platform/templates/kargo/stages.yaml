apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: gitops-repo
  namespace: gitops-control
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
  - git:
      alias: gitops
      branch: main
      repoURL: https://github.com/ankur512512/gitops-infra-repo.git
      includePaths:
      - apps/gitops-app/base
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: gitops-control
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: gitops-repo
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: warehouseName
        value: gitops-repo
      - name: imageRepo
        value: nginx
      steps:
      - uses: git-clone
        as: clone
        config:
          repoURL: https://github.com/ankur512512/gitops-infra-repo.git
          checkout:
          - branch: main
            path: out
      - uses: kustomize-set-image
        config:
          path: out/apps/gitops-app/overlays/dev
          images:
          - image: nginx
            tag: {{ "${{ outputs.clone.commits.out }}" }}
      - uses: git-commit
        config:
          path: out
          message: |
            {{ "${{ ctx.stage }}: Update image tag to ${{ outputs.clone.commits.out }}" }}

            Automated promotion triggered by Kargo.
            Freight: {{ "${{ ctx.promotion.freight }}" }}
      - uses: git-push
        config:
          path: out
---
apiVersion: kargo.akuity.io/v1alpha1
