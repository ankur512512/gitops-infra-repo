apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: gitops-repo
  namespace: gitops-control
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
  - git:
      alias: infra
      branch: main
      repoURL: https://github.com/ankur512512/gitops-infra-repo.git
  - git:
      alias: app
      branch: main
      repoURL: https://github.com/ankur512512/gitops-app-repo.git
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: gitops-control
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: gitops-repo
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - uses: git-clone
        as: clone
        config:
          repoURL: https://github.com/ankur512512/gitops-infra-repo.git
          checkout:
          - branch: main
            path: out
      - uses: kustomize-set-image
        config:
          path: out/apps/gitops-app/overlays/dev
          images:
          - image: ghcr.io/ankur512512/gitops-app-repo
            tag: {{ "sha-${{ (freight.commits.app | substr 0 7) }}" }}
      - uses: git-commit
        config:
          path: out
          message: |
            {{ "${{ ctx.stage }}: Update image tag to sha-${{ (freight.commits.app | substr 0 7) }}" }}

            Promoting Freight: {{ "${{ freight.name }}" }}
            App Commit: {{ "${{ freight.commits.app }}" }}
            Infra Commit: {{ "${{ freight.commits.infra }}" }}
      - uses: git-push
        config:
          path: out
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stage
  namespace: gitops-control
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: gitops-repo
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      steps:
      - uses: git-clone
        as: clone
        config:
          repoURL: https://github.com/ankur512512/gitops-infra-repo.git
          checkout:
          - branch: main
            path: out
      - uses: kustomize-set-image
        config:
          path: out/apps/gitops-app/overlays/stage
          images:
          - image: ghcr.io/ankur512512/gitops-app-repo
            tag: {{ "sha-${{ (freight.commits.app | substr 0 7) }}" }}
      - uses: git-commit
        config:
          path: out
          message: |
            {{ "${{ ctx.stage }}: Update image tag to sha-${{ (freight.commits.app | substr 0 7) }}" }}
      - uses: git-push
        config:
          path: out
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: gitops-control
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: gitops-repo
    sources:
      stages:
      - stage
  promotionTemplate:
    spec:
      steps:
      - uses: git-clone
        as: clone
        config:
          repoURL: https://github.com/ankur512512/gitops-infra-repo.git
          checkout:
          - branch: main
            path: out
      - uses: kustomize-set-image
        config:
          path: out/apps/gitops-app/overlays/prod
          images:
          - image: ghcr.io/ankur512512/gitops-app-repo
            tag: {{ "sha-${{ (freight.commits.app | substr 0 7) }}" }}
      - uses: git-commit
        config:
          path: out
          message: |
            {{ "${{ ctx.stage }}: Update image tag to sha-${{ (freight.commits.app | substr 0 7) }}" }}
      - uses: git-push
        config:
          path: out
