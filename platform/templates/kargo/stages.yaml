apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: gitops-repo
  namespace: kargo
spec:
  project: gitops
  subscriptions:
  - git:
      repoURL: https://github.com/ankur512512/gitops-infra-repo.git
      branch: main
      directories:
      - apps/gitops-app/base
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo
spec:
  project: gitops
  subscriptions:
    warehouse: gitops-repo
  promotionMechanisms:
    gitRepoUpdates:
    - repoURL: https://github.com/ankur512512/gitops-infra-repo.git
      writeBranch: main
      kustomize:
        images:
        - image: nginx
          path: apps/gitops-app/overlays/dev
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stage
  namespace: kargo
spec:
  project: gitops
  subscriptions:
    upstreamStages:
    - name: dev
  promotionMechanisms:
    gitRepoUpdates:
    - repoURL: https://github.com/ankur512512/gitops-infra-repo.git
      writeBranch: main
      kustomize:
        images:
        - image: nginx
          path: apps/gitops-app/overlays/stage
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo
spec:
  project: gitops
  subscriptions:
    upstreamStages:
    - name: stage
  promotionMechanisms:
    gitRepoUpdates:
    - repoURL: https://github.com/ankur512512/gitops-infra-repo.git
      writeBranch: main
      kustomize:
        images:
        - image: nginx
          path: apps/gitops-app/overlays/prod
