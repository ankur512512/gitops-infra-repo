apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: default
spec:
  secretName: gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.ankur.theworkpc.com"
  dnsNames:
  - "*.ankur.theworkpc.com"
  - "ankur.theworkpc.com"
