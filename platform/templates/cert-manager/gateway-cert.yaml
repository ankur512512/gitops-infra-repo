apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: default
spec:
  secretName: gateway-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  issuerRef:
    name: local-ca-issuer
    kind: ClusterIssuer
  commonName: "*.ankur.theworkpc.com"
  dnsNames:
  - "*.ankur.theworkpc.com"
  - "ankur.theworkpc.com"
