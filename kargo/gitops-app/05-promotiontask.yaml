apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: update-image-tag
  namespace: gitops
spec:
  vars:
    - name: gitRepo
      value: https://github.com/ankur512512/gitops-infra-repo.git
    - name: imageRepo
      value: ghcr.io/ankur512512/gitops-app-repo
    - name: overlayPath
    - name: argoApp
    - name: stageName
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitRepo }}
        checkout:
          - branch: main
            path: ./repo
    - uses: kustomize-set-image
      config:
        path: ./repo/${{ vars.overlayPath }}
        images:
          - image: ${{ vars.imageRepo }}
            tag: ${{ imageFrom(vars.imageRepo).Tag }}
    - uses: git-commit
      config:
        path: ./repo
        message: "${{ vars.stageName }}: promote to ${{ imageFrom(vars.imageRepo).Tag }}"
    - uses: git-push
      config:
        path: ./repo
    - uses: argocd-update
      config:
        apps:
          - name: ${{ vars.argoApp }}
