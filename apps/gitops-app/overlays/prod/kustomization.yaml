apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
namespace: gitops-prod
images:
- name: ghcr.io/ankur512512/gitops-app-repo
patches:
- target:
    kind: Deployment
    name: gitops-app
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
      - name: ENV
        value: prod
